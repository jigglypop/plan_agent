name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Package
        run: |
          tar --exclude='node_modules' --exclude='.venv' --exclude='./data' \
              --exclude='.git' --exclude='__pycache__' --exclude='.env' \
              --exclude='example' --exclude='.uv' \
              -czf /tmp/plan-agent.tar.gz .

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key.pem
          chmod 600 ~/.ssh/key.pem
          SSH="ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ec2-user@$HOST"
          SCP="scp -i ~/.ssh/key.pem -o StrictHostKeyChecking=no"

          $SCP /tmp/plan-agent.tar.gz ec2-user@$HOST:~

          echo "$ENV_FILE" > /tmp/.env
          $SCP /tmp/.env ec2-user@$HOST:~/plan-agent/.env

          $SSH "cd ~/plan-agent \
            && tar xzf ~/plan-agent.tar.gz \
            && sed -i 's/\r$//' entrypoint.sh \
            && sudo docker rm -f plan-agent \
            && sudo docker build --no-cache -t plan-agent . \
            && sudo docker run -d --name plan-agent -p 8000:8000 \
               --env-file ~/plan-agent/.env --restart unless-stopped plan-agent \
            && sudo docker system prune -f"

      - name: Health check
        env:
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting 90s for startup..."
          sleep 90
          curl -sf --max-time 10 http://$HOST:8000/api/health | head -c 200
          echo ""
          echo "Deploy OK"
