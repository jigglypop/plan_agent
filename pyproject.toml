[project]
name = "plan-agent"
version = "0.1.0"
description = "AI 기반 기획위원회 PM/통계 시스템"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "notion-client>=2.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.17.0",
    "pydantic>=2.0.0",
    "chromadb>=1.4.1",
    "mcp>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
