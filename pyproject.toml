[project]
name = "plan-agent"
version = "0.1.0"
description = "AI 기반 기획위원회 에이전트"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai>=1.12.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "notion-client>=2.2.0",
    "py-cord[voice]>=2.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.17.0",
    "mcp>=1.26.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pypdf2>=3.0.1",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
